name: CI

# Every pull request and every push to main runs the test suite and type-checks the frontend.
# The backend job installs requirements-ci.txt (requirements.txt minus the ML runtime, ~0.6 GB)
# so it finishes in a few minutes; tests that need real models are marked `needs_ml`, are skipped
# here with the reason printed (-rs), and run in the backend container (see backend/tests/conftest.py).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: requirements-ci.txt is in sync with requirements.txt
        run: python scripts/make_ci_requirements.py --check
      - name: Install dependencies (no ML runtime)
        run: pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -q -rs

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
