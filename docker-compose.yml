
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - faiss_data:/app/faiss_index
      - upload_data:/app/uploads
      - action_data:/app/data
      # Workspace files land here on the HOST so "make this file" produces something real.
      - ./praxis-workspace:/app/praxis-workspace
      # Model caches: the embedding/reranker models and EasyOCR weights are downloaded
      # at runtime; without these volumes every recreate re-downloads ~300 MB (and a
      # DNS blip at boot then breaks startup).
      - hf_cache:/root/.cache/huggingface
      - easyocr_models:/root/.EasyOCR
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Point at the host's Ollama, which has CUDA access to the RTX 2050.
      # The bundled `ollama` container is CPU-only (no GPU passthrough), so
      # using it would run inference on the CPU and be ~10x slower.
      # Requires the host Ollama to listen on 0.0.0.0 (see README / .env).
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      # Vision model for image uploads. On this 4 GB GPU llava:latest (4.7 GB) spills to
      # CPU and times out, and moondream tends to return empty replies to the OCR-augmented
      # prompt; the q4 7B build answers in ~25 s. The analyzer still falls back down its list.
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:7b-v1.5-q4_0}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Inside compose Redis is always the `redis` service; the .env value (localhost)
      # is for running the backend outside Docker and must not leak in here.
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Metasearch tier for web search (see backend/retrieval/web_search.py). Unset to disable.
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=/app/data
      - WORKSPACE_DIR=/app/praxis-workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend

  searxng:
    # Self-hosted metasearch: the backend's first web-search tier. Queries the big
    # engines server-side and returns JSON, instead of the backend scraping one
    # engine's HTML (which earns the address a CAPTCHA after a burst).
    image: searxng/searxng:latest
    volumes:
      - ./deployment/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Real key lives in .env (gitignored); settings.yml carries only a placeholder.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  faiss_data:
  hf_cache:
  easyocr_models:
  action_data:
  upload_data:
  ollama_data:
  redis_data:
