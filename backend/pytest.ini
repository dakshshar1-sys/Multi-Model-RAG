[pytest]
testpaths = tests
addopts = -p no:cacheprovider --strict-markers
markers =
    slow: loads a real model or runs real OCR; seconds rather than milliseconds.
    needs_ml: needs the ML runtime (torch, sentence-transformers, faiss, easyocr). Skipped, and listed, when it is absent - e.g. in CI. Runs in the backend container.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
